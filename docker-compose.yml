version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: wikilive
      POSTGRES_USER: wikiuser
      POSTGRES_PASSWORD: wikipass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wikilive
      SPRING_DATASOURCE_USERNAME: wikiuser
      SPRING_DATASOURCE_PASSWORD: wikipass
      SPRING_REDIS_HOST: redis
      MWS_TABLES_API_URL: https://tables.mws.ru/api
      MWS_GPT_API_URL: https://gpt.mws.ru/api
      MWS_GPT_API_KEY: sk-ewgiaPC3A6pPDYHwR8siVA
    volumes:
      - ./config:/app/config

volumes:
  pgdata: